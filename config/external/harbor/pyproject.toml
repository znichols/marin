[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive]",
    "marin-rigging>=0.2.0",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# Pre-merge Harbor Pi continuation capture (marin-community/harbor#249).
# Restore the upstream main-branch source after the PR merges.
harbor = { git = "https://github.com/znichols/harbor.git", rev = "b9f5fe66060f4ccb5971f13c242f706859382969" }
